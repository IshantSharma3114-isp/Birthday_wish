<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6f4">
  <title>Happy Birthday, Asha Nain!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

    :root {
      --ink: #3c2637;
      --rose: #e97891;
      --deep: #b84e70;
      --cream: #fff8f3
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      background: radial-gradient(ellipse at 15% 10%, #ffe0e6 0, transparent 33%), radial-gradient(ellipse at 90% 85%, #f6d7ef 0, transparent 30%), var(--cream);
      overflow-x: hidden
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 42px 18px;
      position: relative;
      isolation: isolate
    }

    .card {
      width: min(720px, 100%);
      text-align: center;
      padding: clamp(32px, 7vw, 68px) clamp(22px, 7vw, 70px);
      border: 1px solid #ffffffc9;
      border-radius: 32px;
      background: #ffffffa8;
      box-shadow: 0 24px 80px #9f52621b;
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 1
    }

    .eyebrow {
      color: var(--deep);
      text-transform: uppercase;
      letter-spacing: .23em;
      font-size: .72rem;
      font-weight: 700
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(3.4rem, 11vw, 6.5rem);
      line-height: .98;
      margin: 18px 0 12px;
      color: #6e3b56;
      letter-spacing: -.045em
    }

    h1 span {
      display: block;
      font-size: .51em;
      color: var(--deep);
      margin-top: 12px;
      letter-spacing: .01em
    }

    .rule {
      width: 62px;
      height: 3px;
      border-radius: 3px;
      background: linear-gradient(90deg, #f5b5b8, #cc6d91);
      margin: 25px auto
    }

    .message {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.15rem, 3vw, 1.45rem);
      line-height: 1.75;
      max-width: 510px;
      margin: 0 auto;
      color: #654a5b
    }

    .signature {
      margin-top: 22px;
      font-size: .9rem;
      color: #8d687d
    }

    button {
      margin-top: 32px;
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      background: linear-gradient(135deg, #e97891, #ca6385);
      color: white;
      font: 600 .95rem 'DM Sans', sans-serif;
      box-shadow: 0 9px 22px #ca638544;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px #ca638566
    }

    button:focus-visible {
      outline: 3px solid #7f3a5c;
      outline-offset: 4px
    }

    .note {
      min-height: 1.5em;
      margin: 15px 0 0;
      font-size: .9rem;
      color: #a45070
    }

    .lyrics {
      display: none;
      max-width: 520px;
      margin: 24px auto 0;
      padding: 20px 24px;
      border: 1px solid #f3cfda;
      border-radius: 20px;
      background: #fff8f3d9;
      color: #8f4564;
      font: 600 clamp(1.05rem, 3vw, 1.35rem)/1.6 'Playfair Display', Georgia, serif;
      box-shadow: 0 12px 32px #9f526218
    }

    .lyrics.visible {
      display: block;
      animation: lyric-in .7s cubic-bezier(.2, .8, .2, 1) both
    }

    .lyrics span {
      display: inline-block;
      animation: word-pop .55s both;
      animation-delay: calc(var(--i)*.16s)
    }

    .sparkle {
      position: absolute;
      color: #d4839e;
      opacity: .7;
      animation: twinkle 3s ease-in-out infinite
    }

    .s1 {
      top: 10%;
      left: 13%;
      font-size: 28px
    }

    .s2 {
      top: 18%;
      right: 15%;
      font-size: 19px;
      animation-delay: .8s
    }

    .s3 {
      bottom: 15%;
      left: 10%;
      font-size: 21px;
      animation-delay: 1.5s
    }

    .s4 {
      bottom: 11%;
      right: 12%;
      font-size: 29px;
      animation-delay: .4s
    }

    .confetti {
      position: fixed;
      top: -20px;
      z-index: 3;
      pointer-events: none;
      animation: fall linear forwards
    }

    .compliment {
      position: fixed;
      z-index: 4;
      left: var(--x);
      top: var(--y);
      max-width: 190px;
      padding: 13px 18px;
      border: 1px solid #fff;
      border-radius: 18px;
      background: linear-gradient(145deg, #fffdfc, #ffe9ef);
      color: #8c4561;
      font-weight: 700;
      font-size: clamp(.85rem, 2vw, 1rem);
      text-align: center;
      box-shadow: 0 12px 30px #87415929;
      pointer-events: none;
      opacity: 0;
      animation: card-pop 4.4s ease-in-out forwards;
      animation-delay: var(--delay)
    }

    @keyframes twinkle {
      50% {
        transform: scale(.65) rotate(25deg);
        opacity: .3
      }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: .1
      }
    }

    @keyframes lyric-in {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.96)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    @keyframes word-pop {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.85)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    @keyframes card-pop {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(.75) rotate(-4deg)
      }

      12%,
      82% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0)
      }

      100% {
        opacity: 0;
        transform: translateY(-14px) scale(.92) rotate(3deg)
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <main class="page"><span class="sparkle s1" aria-hidden="true">✦</span><span class="sparkle s2"
      aria-hidden="true">✧</span><span class="sparkle s3" aria-hidden="true">✧</span><span class="sparkle s4"
      aria-hidden="true">✦</span>
    <section class="card" aria-labelledby="birthday-title">
      <div class="eyebrow">A little celebration for you</div>
      <h1 id="birthday-title">Happy Birthday<span>ASHA NAIN</span></h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="message">May your day be filled with laughter, lovely surprises, and all the little things that make you
        smile. You deserve a year as wonderful as you are.</p>
      <p class="signature">Wishing you the happiest birthday ✿</p><button id="wish-button" type="button">Make a little
        wish ✨</button>
      <p class="note" id="note" aria-live="polite"></p>
      <div class="lyrics" id="lyrics" aria-live="polite"></div><audio id="birthday-song" src="21st_birthday_wish.mp3"
        preload="metadata"></audio>
    </section>
  </main>
  <script>
    const button = document.querySelector('#wish-button'); const note = document.querySelector('#note'); const audio = document.querySelector('#birthday-song'); const lyrics = document.querySelector('#lyrics'); const colors = ['#e97891', '#f4bd78', '#c796d4', '#f3a6b5', '#b7a4df']; const compliments = ['Radiant', 'Kind-hearted', 'Brilliant', 'Courageous', 'Thoughtful', 'Creative', 'Graceful', 'Joyful', 'Resilient', 'Genuine', 'Wonderful', 'Magnetic', 'Compassionate', 'Clever', 'Inspiring', 'Adventurous', 'Elegant', 'Warm-hearted', 'Unforgettable', 'Amazing', 'Loved']; let stopTimer;
    function celebrate() { for (let i = 0; i < 48; i++) { const piece = document.createElement('span'); piece.className = 'confetti'; piece.textContent = Math.random() > .45 ? '✦' : '♥'; piece.style.left = `${Math.random() * 100}vw`; piece.style.color = colors[Math.floor(Math.random() * colors.length)]; piece.style.fontSize = `${10 + Math.random() * 14}px`; piece.style.animationDuration = `${2.4 + Math.random() * 2.2}s`; document.body.appendChild(piece); window.setTimeout(() => piece.remove(), 5000) } compliments.forEach((word, i) => { const popup = document.createElement('div'); popup.className = 'compliment'; popup.textContent = word; popup.style.setProperty('--x', `${5 + Math.random() * 72}vw`); popup.style.setProperty('--y', `${8 + Math.random() * 72}vh`); popup.style.setProperty('--delay', `${i * .32}s`); document.body.appendChild(popup); window.setTimeout(() => popup.remove(), 5000 + i * 320) }) }
    button.addEventListener('click', () => { note.textContent = 'May every lovely thing you wish for find its way to you!'; lyrics.replaceChildren(); const line = 'He said, "it supposed to be fun turning 21."'; line.split(' ').forEach((word, i) => { const span = document.createElement('span'); span.textContent = word + (i < line.split(' ').length - 1 ? ' ' : ''); span.style.setProperty('--i', i); lyrics.appendChild(span) }); lyrics.classList.remove('visible'); void lyrics.offsetWidth; lyrics.classList.add('visible'); window.clearTimeout(stopTimer); audio.pause(); audio.currentTime = 0; audio.play().then(() => { stopTimer = window.setTimeout(() => { audio.pause(); audio.currentTime = 0; note.textContent = 'Hope you enjoyed your birthday song!' }, 30000) }).catch(() => { note.textContent = 'Could not play the song. Check that 21st_birthday_wish.mp3 is beside this page.' }); celebrate() });
  </script>
</body>

</html>
